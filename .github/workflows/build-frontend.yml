name: Build frontend dist

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Package dist
        run: |
          cd frontend/dist
          zip -qr ../../dist.zip .

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frontend-latest
          name: Frontend dist (latest)
          body: 由 GitHub Actions 自动构建的前端静态包，供 zy-panel 面板热更新下载。
          files: dist.zip
