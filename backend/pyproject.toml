[project]
name = "oci-panel-backend"
version = "0.2.0"
description = "Oracle OCI 云服务器管理面板（oci-helper 重写版）后端 - FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    # passlib 的 bcrypt 后端与 bcrypt>=4.1 不兼容，锁定 4.0.1
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "cryptography>=42.0",
    "apscheduler>=3.10",
    "oci>=2.140",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "paramiko>=3.4",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "aliyun-python-sdk-core>=2.13",
    "aliyun-python-sdk-ecs>=4.24",
    "aliyun-python-sdk-cms>=7.0",
    "aliyun-python-sdk-bssopenapi>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
